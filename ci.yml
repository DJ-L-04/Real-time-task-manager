# .github/workflows/ci.yml
#
# CI pipeline that runs on every push and pull request.
# Two jobs: lint (code quality) and test (correctness).
# If either fails, the PR can't be merged.

name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install flake8
        run: pip install flake8

      - name: Run linter
        run: flake8 app/ --max-line-length=100 --ignore=E501,W503

  test:
    name: Test
    runs-on: ubuntu-latest

    # Services spin up as Docker containers alongside the test runner
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          # Tests use SQLite so no Postgres needed in CI
          DATABASE_URL: sqlite:///./test.db
          REDIS_URL: redis://localhost:6379
          SECRET_KEY: test-secret-key
          ALGORITHM: HS256
        run: pytest tests/ -v --tb=short

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test.db
        if: always()
